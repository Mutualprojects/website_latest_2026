# Nginx config for brihaspathi.com
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled
# Certbot will add SSL and redirect after: sudo certbot --nginx -d brihaspathi.com -d www.brihaspathi.com

server {
    listen 80;
    listen [::]:80;
    server_name brihaspathi.com www.brihaspathi.com;

    location / {
        proxy_pass http://127.0.0.1:6005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
